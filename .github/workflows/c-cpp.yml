name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: readline
      run: sudo apt-get install lib32readline7 lib32readline-dev 
    - name: make
      run: make
    - name: minishell
      run: ./minishell
