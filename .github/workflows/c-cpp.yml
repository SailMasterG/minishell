name: C/C++ CI
# Should only work on main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: readline
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev libncurses-dev
    - name: make
      run: make
    - name: minishell
      run: ./minishell
